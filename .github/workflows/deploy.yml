name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows re-running the deployment from the Actions tab.
  workflow_dispatch:

# Required by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Run one deployment at a time; do not cancel a deployment in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Same version as local development.
          flutter-version: 3.47.5
          cache: true

      - run: flutter pub get

      # Nothing is published unless the code passes both.
      - run: flutter analyze
      - run: flutter test

      # Project Pages are served from /<repository>/.
      - run: flutter build web --release --base-href /pendulum_feeding_game/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
